services:
  - type: web
    name: bankguard-backend
    runtime: node
    plan: free
    rootDir: BANKGUARD_Angular_Starter/BANKGUARD/server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

