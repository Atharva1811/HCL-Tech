name: Deploy BANKGUARD to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: BANKGUARD_Angular_Starter/BANKGUARD/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: BANKGUARD_Angular_Starter/BANKGUARD
        run: npm ci

      - name: Install Backend Test Dependencies
        working-directory: BANKGUARD_Angular_Starter/BANKGUARD/server
        run: npm ci

      - name: Run Automated Verification Tests
        working-directory: BANKGUARD_Angular_Starter/BANKGUARD
        run: |
          node tests/rbac.test.js
          node tests/fraud-engine.test.js

      - name: Build Angular Application for GitHub Pages
        working-directory: BANKGUARD_Angular_Starter/BANKGUARD
        run: npm run build -- --base-href /HCL-Tech/

      - name: Prepare SPA Routing and Static Files
        working-directory: BANKGUARD_Angular_Starter/BANKGUARD/dist/bankguard/browser
        run: |
          cp index.html 404.html
          touch .nojekyll

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: BANKGUARD_Angular_Starter/BANKGUARD/dist/bankguard/browser
          publish_branch: gh-pages
          force_orphan: true
