<div class="layout" [class.sidebar-collapsed]="sidebarCollapsed()">
  <!-- Sidebar -->
  <bg-sidebar
    [collapsed]="sidebarCollapsed()"
    (toggleCollapse)="toggleSidebar()">
  </bg-sidebar>

  <!-- Main area -->
  <div class="main-area">
    <!-- Topbar -->
    <bg-topbar (menuToggle)="toggleSidebar()"></bg-topbar>

    <!-- Page content -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <div class="footer-left">
        <span class="footer-brand">BANKGUARD</span>
        <span class="footer-divider">·</span>
        <span>Banking Intelligence Platform</span>
      </div>
      <div class="footer-right">
        <span>Demo Environment</span>
        <span class="footer-divider">·</span>
        <span>All data is synthetic</span>
      </div>
    </footer>
  </div>

  <!-- Mobile overlay -->
  @if (!sidebarCollapsed()) {
    <div class="mobile-overlay" (click)="toggleSidebar()"></div>
  }
</div>
